{% extends "admin/change_list.html" %}
{% load static %}

{% block extrahead %}
  {{ block.super }}
  <meta name="don-chugo-orders-signature" content="{{ pedidos_live_signature }}">
  <meta name="don-chugo-orders-max-id" content="{{ pedidos_live_max_id }}">
  <meta name="don-chugo-orders-live-url" content="{% url 'admin:pedidos_pedido_estado_en_vivo' %}">
  <meta name="don-chugo-orders-status-url" content="{% url 'admin:pedidos_pedido_cambiar_estado' %}">
  <script src="{% static 'js/admin-orders-live.js' %}?v=20260719-2" defer></script>
  <style>
    .dc-btn-asistido {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 12px;
      padding: 7px 14px;
      border-radius: 8px;
      background: linear-gradient(135deg, #c81024, #861714);
      color: #fff !important;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(134,23,20,.25);
      transition: transform .15s, box-shadow .2s;
    }
    .dc-btn-asistido:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(134,23,20,.32);
      color: #fff;
    }
    /* El h1 del header de Unfold trae overflow:hidden y recortaba el menú */
    h1:has(.dc-orders-live-heading) { overflow: visible !important; }
    /* Variante dorada para el botón de pedidos para llevar */
    .dc-btn-llevar {
      margin-left: 6px;
      background: linear-gradient(135deg, #a96b1f, #713f11);
      box-shadow: 0 4px 10px rgba(113,63,17,.25);
    }
    .dc-btn-llevar:hover { box-shadow: 0 6px 14px rgba(113,63,17,.32); }
  </style>
{% endblock %}

{% block content_title %}
  <div class="dc-orders-live-heading">
    {{ block.super }}
    <span class="dc-orders-live-badge"><i></i> Pedidos en vivo</span>
    <a href="/gerente/floor-plan/?asistido=1" class="dc-btn-asistido" title="Asignar mesa a un cliente y tomarle el pedido">
      🤝 Pedido asistido
    </a>
    <a href="/gerente/floor-plan/?llevar=1" class="dc-btn-asistido dc-btn-llevar" title="Pedido sin mesa, para llevar">
      🥡 Para llevar
    </a>
  </div>
{% endblock %}
