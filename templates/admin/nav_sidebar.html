{% load i18n %}

<div class="relative z-50">
  <div
    onclick="toggleDonChugoSidebar()"
    hx-get="{% url 'admin:toggle_sidebar' %}"
    hx-swap="none"
    class="dc-sidebar-toggle block bg-white border cursor-pointer fixed flex h-6 hidden items-center justify-center rounded-full text-gray-500 top-5 -translate-x-1/2 w-6 z-50 xl:flex dark:bg-gray-800 dark:border-gray-700 dark:text-gray-200"
    aria-label="Mostrar u ocultar menú"
  >
    <span class="material-symbols-outlined md-16">first_page</span>
  </div>

  <div
    onclick="toggleDonChugoMobileSidebar()"
    class="dc-sidebar-mobile-toggle fixed bottom-0 bg-gray-700 flex cursor-pointer items-center left-0 mb-2 ml-2 justify-center px-2 py-1 rounded-full shadow-sm text-xs text-white uppercase z-50 xl:hidden"
  >
    {% trans "Menu" %}
  </div>

  <div
    class="dc-sidebar-shell is-desktop-open"
  >
    {% include "unfold/helpers/navigation.html" %}
  </div>
</div>
