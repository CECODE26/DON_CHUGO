name: don-chugo

services:
  db:
    image: mariadb:10.6
    container_name: don_chugo_db
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: don-chugo-web:latest
    container_name: don_chugo_web
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
  static_volume:
